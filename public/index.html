<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十种极致前端风格全景测试舱 // FRONTEND AESTHETIC BENCHMARK</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --bg: #090A0F;
      --card: #12151E;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366F1;
      --text: #F3F4F6;
      --muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.14), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12), transparent 40%);
    }

    header.benchmark-header {
      max-width: 1480px;
      margin: 0 auto;
      padding: 36px 32px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-group h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 8px;
    }

    .tag-pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #A5B4FC;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* Interactive Judge Scoreboard */
    .score-widget {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .total-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 800;
      color: #34D399;
    }

    /* Live Iframe Drawer */
    .preview-drawer {
      max-width: 1480px;
      margin: 24px auto 0;
      padding: 0 32px;
      display: none;
    }

    .preview-drawer.active {
      display: block;
    }

    .iframe-shell {
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65);
    }

    .iframe-bar {
      background: #181B26;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    iframe#liveFrame {
      width: 100%;
      height: 580px;
      border: none;
      display: block;
      background: #fff;
    }

    /* 10 Cards Grid */
    .cards-grid {
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px 32px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
      gap: 22px;
    }

    @media (max-width: 520px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .style-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .style-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .swatch-strip {
      height: 6px;
      width: 100%;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      margin: 6px 0 10px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-link {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      transition: all 0.15s;
    }

    .btn-link:hover {
      background: #fff;
      color: #000;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .rate-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .rate-input {
      width: 56px;
      background: #090A0F;
      border: 1px solid rgba(255,255,255,0.2);
      color: #34D399;
      padding: 5px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="benchmark-header">
    <div class="title-group">
      <span class="tag-pill">10 DISTINCT FRONTEND ARCHITECTURES // ZERO TEMPLATES</span>
      <h1>十种完全不同风格的前端页面 · 评测总控台</h1>
    </div>

    <div class="score-widget">
      <div>
        <div style="font-size:12px; color:var(--muted);">考官实时总评分 (满分 100)</div>
        <div style="font-size:12px; color:#A5B4FC;">可在下方每张卡片单独打分 (0-10分)</div>
      </div>
      <div class="total-score" id="totalScoreDisplay">100 / 100</div>
    </div>
  </header>

  <!-- Live In-Page Preview Drawer -->
  <section class="preview-drawer" id="previewDrawer">
    <div class="iframe-shell">
      <div class="iframe-bar">
        <span id="previewTitle">LIVE PREVIEW // 01-neo-brutalism.html</span>
        <div style="display:flex; gap:10px;">
          <a href="01-neo-brutalism.html" target="_blank" id="openNewTabLink" class="btn-link" style="padding:4px 12px;">↗ 全屏独立打开</a>
          <button class="btn-link" style="padding:4px 12px;" onclick="closePreview()">✕ 收起预览窗</button>
        </div>
      </div>
      <iframe id="liveFrame" src=""></iframe>
    </div>
  </section>

  <main class="cards-grid" id="cardsContainer">
    <!-- Generated by JS -->
  </main>

  <script>
    const pages = [
      {
        num: 'STYLE 01',
        file: '01-neo-brutalism.html',
        title: '新粗野主义合成器与街头贴纸实验室',
        en: 'Neo-Brutalism Beatmaker & Sticker Lab',
        grad: 'linear-gradient(90deg, #FFE600, #FF3366, #00E575)',
        desc: '4px 纯黑实线边框、8px 硬边投射阴影、高饱和撞色。内置真实发声的 WebAudio 8步音序鼓机与可自由拖拽排版的街头贴纸画布。'
      },
      {
        num: 'STYLE 02',
        file: '02-cyberpunk-hud.html',
        title: '赛博朋克深空防御战术终端 HUD',
        en: 'Cyberpunk Orbital Tactical Radar HUD',
        grad: 'linear-gradient(90deg, #00F0FF, #FF0055, #FFB800)',
        desc: '多边形斜切机甲面板、CRT 扫描线与霓虹发光。搭载 60FPS 相控阵雷达（点击敌机直接发射电磁炮拦截）与命令行终端。'
      },
      {
        num: 'STYLE 03',
        file: '03-swiss-editorial.html',
        title: '瑞士国际主义排版与建筑展览志',
        en: 'Swiss International Typographic Grid',
        grad: 'linear-gradient(90deg, #E62E25, #121212, #F4F1EA)',
        desc: '致敬 Müller-Brockmann 的严格 12 列数学网格。支持一键显隐 12 栏参考线、实时调节无衬线标题字号比例与展览分类筛选。'
      },
      {
        num: 'STYLE 04',
        file: '04-glassmorphism-os.html',
        title: '液态极光与空间计算毛玻璃系统',
        en: 'Spatial Computing & Aurora Glassmorphism',
        grad: 'linear-gradient(90deg, #6366F1, #EC4899, #06B6D4)',
        desc: '多层高斯模糊毛玻璃、高光折射边与 3D 视差悬浮窗。内置全息呼吸专注光球、WebAudio 174Hz 治愈声场混音台与极光光谱切换器。'
      },
      {
        num: 'STYLE 05',
        file: '05-y2k-retro-os.html',
        title: '千禧年复古桌面系统 (Win98 / Y2K)',
        en: 'Y2K Retro Desktop OS 98',
        grad: 'linear-gradient(90deg, #008080, #000080, #C0C0C0)',
        desc: '像素级还原经典凹凸立体边框、开始菜单与多窗口拖拽层级管理。内置可绘画盖章的画图板 Paint.exe 与 56K 拨号音/电子乐播放器。'
      },
      {
        num: 'STYLE 06',
        file: '06-zen-minimalist.html',
        title: '东方侘寂茶道与数字枯山水庭院',
        en: 'Wabi-Sabi Tea Ceremony & Karesansui',
        grad: 'linear-gradient(90deg, #4A5D4E, #EAE2D3, #B83B2B)',
        desc: '温润宣纸底纹、宋刻竖排诗文与朱砂印章。可用鼠标木耙在枯山水沙盘上勾勒涟漪、置入青苔山石，并体验颂钵铜磬候汤计时。'
      },
      {
        num: 'STYLE 07',
        file: '07-luxury-watch.html',
        title: '黑金顶奢陀飞轮高定机械腕表馆',
        en: 'Haute Horlogerie Tourbillon Atelier',
        grad: 'linear-gradient(90deg, #D4AF37, #F3E5AB, #1A2230)',
        desc: '黑曜石与 18K 香槟金奢华质感。搭载实时同步走时的精细 SVG 机械腕表（含旋转陀飞轮笼架、飞返计时秒针、镂空机芯透视与表壳定制）。'
      },
      {
        num: 'STYLE 08',
        file: '08-clay-playful.html',
        title: '3D 软泥粘土风互动盲盒游乐园',
        en: '3D Claymorphism Interactive Toybox',
        grad: 'linear-gradient(90deg, #FF85B3, #52E5B7, #FFD15C)',
        desc: '马卡龙多巴胺配色与膨胀感内外双重柔和阴影。包含戳肚子会 Q 弹变形发声的软泥萌宠工坊，以及 15 孔解压硅胶按按乐 (Pop-It)。'
      },
      {
        num: 'STYLE 09',
        file: '09-retro-terminal.html',
        title: '1982 复古绿磷/琥珀 CRT 大型机终端',
        en: '1982 Phosphor CRT Mainframe & Oscilloscope',
        grad: 'linear-gradient(90deg, #33FF66, #FFB000, #061006)',
        desc: '纯正单色荧光余晖与阴极射线管暗角。内置辐射风格十六进制内存密码破译游戏，以及可调李萨如（Lissajous）图形的实时示波器。'
      },
      {
        num: 'STYLE 10',
        file: '10-kinetic-festival.html',
        title: '动态拉伸字体与酸性电子音乐节',
        en: 'Kinetic Typography & Acid Rave Festival',
        grad: 'linear-gradient(90deg, #CCFF00, #7000FF, #111111)',
        desc: '高对比电光酸性绿与液态铬金属星芒。巨型标题随鼠标轨迹实时产生斜切与字宽扭曲，支持舞台阵容筛选与专属 VIP 电音通票生成。'
      }
    ];

    const container = document.getElementById('cardsContainer');

    function renderCards() {
      container.innerHTML = '';
      pages.forEach((p, idx) => {
        const card = document.createElement('article');
        card.className = 'style-card';
        card.innerHTML = `
          <div>
            <div class="swatch-strip" style="background: ${p.grad};"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="card-num">${p.num} // ${p.file}</span>
              <span class="card-num">${p.en}</span>
            </div>
            <h2 class="card-title">${p.title}</h2>
            <p class="card-desc">${p.desc}</p>
          </div>
          <div class="card-actions">
            <div style="display:flex; gap:8px;">
              <a href="${p.file}" class="btn-link btn-primary">进入页面 →</a>
              <button class="btn-link" onclick="openPreview('${p.file}', '${p.title}')">👁 页内预览</button>
            </div>
            <div class="rate-box">
              <span>打分:</span>
              <input type="number" class="rate-input" min="0" max="10" step="0.5" value="10" oninput="recalcTotal()">
              <span>/10</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openPreview(file, title) {
      const drawer = document.getElementById('previewDrawer');
      drawer.classList.add('active');
      document.getElementById('liveFrame').src = file;
      document.getElementById('previewTitle').textContent = `LIVE PREVIEW // ${title} (${file})`;
      document.getElementById('openNewTabLink').href = file;
      drawer.scrollIntoView({ behavior: 'smooth' });
    }

    function closePreview() {
      document.getElementById('previewDrawer').classList.remove('active');
      document.getElementById('liveFrame').src = '';
    }

    function recalcTotal() {
      let sum = 0;
      document.querySelectorAll('.rate-input').forEach(inp => {
        const val = Math.min(10, Math.max(0, Number(inp.value) || 0));
        sum += val;
      });
      document.getElementById('totalScoreDisplay').textContent = `${sum.toFixed(1).replace(/\.0$/, '')} / 100`;
    }

    renderCards();
  </script>
</body>
</html>
