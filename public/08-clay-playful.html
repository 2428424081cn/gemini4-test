<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 // MOCHI.LAND — 3D 软泥粘土风互动盲盒游乐场</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

    :root {
      --bg-cream: #FFF5F8;
      --clay-pink: #FF85B3;
      --clay-purple: #9B72FF;
      --clay-mint: #52E5B7;
      --clay-yellow: #FFD15C;
      --clay-blue: #60B5FF;
      --text- plum: #382452;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #FFE8F2, #EEF4FF 60%, #E8FFF6 100%);
      color: #382452;
      font-family: 'Fredoka', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    /* Claymorphism 3D Puff Mixin Style */
    .clay-box {
      background: #ffffff;
      border-radius: 36px;
      box-shadow:
        20px 24px 42px rgba(132, 102, 179, 0.16),
        inset -8px -10px 18px rgba(180, 165, 215, 0.35),
        inset 8px 10px 18px rgba(255, 255, 255, 0.95);
      padding: 28px;
    }

    .clay-btn {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      color: #382452;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--clay-yellow);
      box-shadow:
        0 12px 24px rgba(255, 190, 40, 0.35),
        inset -5px -6px 10px rgba(215, 145, 0, 0.35),
        inset 5px 6px 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clay-btn:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .clay-btn:active {
      transform: translateY(3px) scale(0.96);
    }

    .clay-btn.pink {
      background: var(--clay-pink);
      color: #fff;
      box-shadow:
        0 12px 24px rgba(255, 133, 179, 0.4),
        inset -5px -6px 10px rgba(200, 60, 115, 0.4),
        inset 5px 6px 10px rgba(255, 220, 235, 0.8);
    }

    .clay-btn.mint {
      background: var(--clay-mint);
      box-shadow:
        0 12px 24px rgba(82, 229, 183, 0.4),
        inset -5px -6px 10px rgba(30, 165, 120, 0.35),
        inset 5px 6px 10px rgba(220, 255, 245, 0.85);
    }

    header.toy-nav {
      max-width: 1320px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .playground-grid {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 28px;
    }

    @media (max-width: 980px) {
      .playground-grid { grid-template-columns: 1fr; }
    }

    /* Interactive Clay Pet Avatar */
    .pet-stage {
      height: 300px;
      border-radius: 32px;
      background: linear-gradient(145deg, #EBF3FF, #F8EBFF);
      box-shadow:
        inset 8px 8px 18px rgba(170, 155, 210, 0.35),
        inset -8px -8px 18px rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 22px 0;
      position: relative;
      overflow: hidden;
    }

    .clay-monster {
      width: 170px;
      height: 155px;
      background: var(--clay-pink);
      border-radius: 52% 48% 46% 54% / 55% 52% 48% 45%;
      box-shadow:
        0 20px 35px rgba(255, 105, 165, 0.38),
        inset -12px -14px 22px rgba(190, 45, 105, 0.42),
        inset 12px 14px 24px rgba(255, 225, 240, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .clay-monster.squish {
      transform: scale(1.22, 0.78) translateY(15px);
    }

    .eyes-row {
      display: flex;
      gap: 32px;
      margin-bottom: 10px;
    }

    .clay-eye {
      width: 24px;
      height: 24px;
      background: #2C1B47;
      border-radius: 50%;
      position: relative;
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.15);
    }

    .clay-eye::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
    }

    .clay-mouth {
      width: 28px;
      height: 14px;
      border-bottom: 5px solid #2C1B47;
      border-radius: 0 0 20px 20px;
    }

    /* Pop-It Fidget Toy Bubble Grid */
    .popit-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      padding: 22px;
      border-radius: 30px;
      background: #F4EEFF;
      box-shadow:
        inset 6px 6px 14px rgba(160, 140, 200, 0.3),
        inset -6px -6px 14px rgba(255, 255, 255, 0.9);
      margin: 20px 0;
    }

    .pop-bubble {
      height: 62px;
      border-radius: 50%;
      cursor: pointer;
      background: var(--clay-mint);
      box-shadow:
        6px 8px 16px rgba(60, 180, 140, 0.32),
        inset -6px -6px 12px rgba(25, 145, 105, 0.4),
        inset 6px 6px 12px rgba(220, 255, 240, 0.9);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: rgba(56, 36, 82, 0.55);
    }

    .pop-bubble.popped {
      transform: scale(0.88);
      background: #D9F7ED;
      box-shadow:
        inset 6px 6px 12px rgba(40, 130, 100, 0.45),
        inset -4px -4px 10px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <header class="toy-nav clay-box">
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-size:32px;">🍡</span>
      <div>
        <div style="font-size:12px; font-weight:700; color:#9B72FF;">STYLE 08 // 3D CLAYMORPHISM TOYBOX</div>
        <h1 style="font-size:26px;">MOCHI.LAND 软泥盲盒游乐园</h1>
      </div>
    </div>
    <div style="display:flex; gap:12px;">
      <a href="index.html" class="clay-btn">← 返回总控台</a>
      <a href="09-retro-terminal.html" class="clay-btn pink">下一风格: 绿磷主机 →</a>
    </div>
  </header>

  <main class="playground-grid">
    <!-- Left: Squishy Clay Pet Customizer -->
    <section class="clay-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-size:24px;">👾 捏捏乐软泥萌宠工坊</h2>
        <span style="background:#EEF4FF; padding:6px 14px; border-radius:999px; font-weight:700;" id="moodBadge">心情值: 100% 开心</span>
      </div>

      <div class="pet-stage">
        <div class="clay-monster" id="clayPet">
          <div class="eyes-row">
            <div class="clay-eye"></div>
            <div class="clay-eye"></div>
          </div>
          <div class="clay-mouth" id="petMouth"></div>
        </div>
        <div style="margin-top:18px; font-size:14px; font-weight:600; opacity:0.75;" id="petSpeech">
          戳一戳我的软泥肚子，会发出 Q 弹气泡音效喔！
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button class="clay-btn pink" onclick="changeClayColor('#FF85B3')">🍓 草莓粉泥</button>
        <button class="clay-btn mint" onclick="changeClayColor('#52E5B7')">🌿 薄荷青泥</button>
        <button class="clay-btn" onclick="changeClayColor('#FFD15C')">🍋 柠檬黄泥</button>
        <button class="clay-btn" style="background:#9B72FF; color:#fff;" onclick="morphClayShape()">🎲 随机变形</button>
      </div>
    </section>

    <!-- Right: Tactile Pop-It Fidget Game -->
    <section class="clay-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-size:24px;">🫧 3D 软胶解压按按乐 (Pop-It)</h2>
        <span style="font-weight:700; color:#FF85B3;">已按压: <strong id="popScore">0</strong> / 15</span>
      </div>
      <p style="font-size:14px; opacity:0.75; margin-top:6px;">
        模拟双层内阴影软硅胶触感，点击气泡体验清脆 WebAudio 啵啵声：
      </p>

      <div class="popit-board" id="popBoard">
        <!-- Generated by JS -->
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button class="clay-btn mint" id="resetPopBtn">🔄 翻转硅胶板全部复原</button>
        <button class="clay-btn pink" id="popAllBtn">✨ 一键连环全按</button>
      </div>
    </section>
  </main>

  <script>
    let audioCtx = null;
    function playBubblePop(pitch = 420) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 2.2, now + 0.09);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Squishy Clay Pet Interaction
    const pet = document.getElementById('clayPet');
    const speech = document.getElementById('petSpeech');
    const lines = [
      '啵唧！好软好有弹性～ ✨',
      '再来一下！多巴胺指数飙升中 🍬',
      '3D 内外双层柔和阴影就是 Claymorphism 的灵魂！',
      '呼噜呼噜～像糯米糍一样软糯 🍡'
    ];

    pet.onclick = () => {
      playBubblePop(320 + Math.random() * 200);
      pet.classList.add('squish');
      speech.textContent = lines[Math.floor(Math.random() * lines.length)];
      setTimeout(() => pet.classList.remove('squish'), 260);
    };

    function changeClayColor(color) {
      playBubblePop(500);
      pet.style.background = color;
    }

    function morphClayShape() {
      playBubblePop(620);
      const r1 = 35 + Math.floor(Math.random() * 35);
      const r2 = 35 + Math.floor(Math.random() * 35);
      const r3 = 35 + Math.floor(Math.random() * 35);
      const r4 = 35 + Math.floor(Math.random() * 35);
      pet.style.borderRadius = `${r1}% ${100-r1}% ${r2}% ${100-r2}% / ${r3}% ${r4}% ${100-r4}% ${100-r3}%`;
    }

    // Pop-It Fidget Board
    const popBoard = document.getElementById('popBoard');
    const bubbleColors = ['#FF85B3', '#FFD15C', '#52E5B7', '#60B5FF', '#9B72FF'];
    let poppedCount = 0;

    function renderPopBoard() {
      popBoard.innerHTML = '';
      poppedCount = 0;
      document.getElementById('popScore').textContent = 0;
      for (let i = 0; i < 15; i++) {
        const b = document.createElement('div');
        b.className = 'pop-bubble';
        const rowColor = bubbleColors[Math.floor(i / 5) % bubbleColors.length];
        b.style.background = rowColor;
        b.textContent = 'POP';
        b.onclick = () => {
          b.classList.toggle('popped');
          const isPopped = b.classList.contains('popped');
          b.textContent = isPopped ? '✓' : 'POP';
          playBubblePop(isPopped ? 480 + i * 25 : 300);
          poppedCount = document.querySelectorAll('.pop-bubble.popped').length;
          document.getElementById('popScore').textContent = poppedCount;
        };
        popBoard.appendChild(b);
      }
    }

    document.getElementById('resetPopBtn').onclick = () => {
      playBubblePop(350);
      renderPopBoard();
    };

    document.getElementById('popAllBtn').onclick = () => {
      document.querySelectorAll('.pop-bubble').forEach((b, idx) => {
        setTimeout(() => {
          if (!b.classList.contains('popped')) b.click();
        }, idx * 45);
      });
    };

    renderPopBoard();
  </script>
</body>
</html>
